# Mesure longue (environ 12 mois de bougies publiques de Binance), chaque lundi, avec la configuration gelée.
name: Mesure longue
on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: mesure-longue
  cancel-in-progress: false
jobs:
  mesure:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: code
      - uses: actions/checkout@v4
        with:
          ref: forward-test
          path: data
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Mesure sur environ 12 mois
        run: node --max-old-space-size=6000 code/tools/mesure-longue.cjs data/forward
      - name: Enregistrer le résultat
        run: |
          cd data
          git config user.name "forward-test"
          git config user.email "forward-test@users.noreply.github.com"
          git add -A forward
          if ! git diff --cached --quiet; then
            git commit -q -m "Mesure longue $(date -u +%Y-%m-%d)"
            git pull -q --rebase origin forward-test && git push -q origin HEAD:forward-test
          fi
