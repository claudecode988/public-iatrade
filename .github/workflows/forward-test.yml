# Forward test 24 h/24 : le même moteur que le site décide sur chaque bougie fermée avec la configuration gelée de
# forward/config.json (branche forward-test). Argent fictif, aucun ordre, aucune clé.
# Les familles de stratégies sont suivies en parallèle (tools/familles-fw.cjs, une décision par heure fermée).
# GitHub retarde souvent les tâches programmées : chaque tâche reste donc active environ 50 minutes et vérifie chaque
# minute si une nouvelle bougie s'est fermée ; une nouvelle tâche est demandée tous les quarts d'heure (une seule à la fois).
name: Forward test 24 h/24
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: forward-test
  cancel-in-progress: false
jobs:
  passage:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
        with:
          path: code
      - uses: actions/checkout@v4
        with:
          ref: forward-test
          path: data
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Décisions sur chaque bougie fermée pendant environ 50 minutes
        run: |
          cd data
          git config user.name "forward-test"
          git config user.email "forward-test@users.noreply.github.com"
          fin=$(( $(date +%s) + 50*60 ))
          while [ $(date +%s) -lt $fin ]; do
            node ../code/tools/forward.cjs forward || true
            node ../code/tools/familles-fw.cjs forward || true
            node ../code/tools/proposition.cjs forward || true
            node ../code/tools/bilan.cjs forward || true
            git add -A forward
            if ! git diff --cached --quiet; then
              git commit -q -m "Forward test $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              git pull -q --rebase origin forward-test && git push -q origin HEAD:forward-test || true
            fi
            sleep 60
          done
