# Forward test 24 h/24 : le même moteur que le site décide sur chaque bougie fermée avec la configuration gelée de
# forward/config.json (branche forward-test). Argent fictif, aucun ordre, aucune clé.
# Les familles de stratégies sont suivies en parallèle (tools/familles-fw.cjs, une décision par heure fermée).
# GitHub retarde ou saute souvent les tâches programmées : chaque tâche reste donc active environ 5 h 30 et vérifie chaque
# minute si une nouvelle bougie s'est fermée, puis demande elle-même la tâche suivante (relance automatique).
# La programmation tous les quarts d'heure reste en secours si une relance se perd (une seule tâche à la fois).
name: Forward test 24 h/24
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  # nouveau nom de groupe : une tâche fantôme bloquée depuis le 11/11 (impossible à annuler) occupait l'ancien
  group: forward-test-v2
  cancel-in-progress: false
jobs:
  passage:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          path: code
      - uses: actions/checkout@v4
        with:
          ref: forward-test
          path: data
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Décisions sur chaque bougie fermée pendant environ 5 h 30
        run: |
          cd data
          git config user.name "forward-test"
          git config user.email "forward-test@users.noreply.github.com"
          fin=$(( $(date +%s) + 330*60 ))
          # En cas de conflit avec la branche distante : on abandonne le rebase et on repart de la version distante
          # (les programmes reprennent là où l'état enregistré s'est arrêté). Jamais de fichier en conflit enregistré.
          sync() { git pull -q --rebase origin forward-test || { git rebase --abort 2>/dev/null; git fetch -q origin forward-test && git reset -q --hard origin/forward-test; return 1; }; }
          while [ $(date +%s) -lt $fin ]; do
            sync || true
            node ../code/tools/forward.cjs forward || echo "::warning::forward.cjs en erreur"
            node ../code/tools/familles-fw.cjs forward || echo "::warning::familles-fw.cjs en erreur"
            node ../code/tools/proposition.cjs forward || echo "::warning::proposition.cjs en erreur"
            node ../code/tools/bilan.cjs forward || echo "::warning::bilan.cjs en erreur"
            rm -f forward/*.tmp
            git add -A forward
            if ! git diff --cached --quiet; then
              git commit -q -m "Forward test $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              for k in 1 2 3; do sync && git push -q origin HEAD:forward-test && break; sleep 5; done
            fi
            sleep 60
          done
      - name: Relance automatique de la tâche suivante
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for k in 1 2 3; do
            gh workflow run forward-test.yml --repo "${{ github.repository }}" --ref main && exit 0
            sleep 10
          done
          echo "::warning::relance impossible : la programmation tous les quarts d'heure prendra le relais"
