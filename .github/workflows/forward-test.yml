# Forward test 24 h/24 : toutes les 5 minutes, le même moteur que le site décide sur la dernière bougie fermée
# avec la configuration gelée de forward/config.json (branche forward-test). Argent fictif, aucun ordre, aucune clé.
name: Forward test 24 h/24
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: forward-test
  cancel-in-progress: false
jobs:
  passage:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          path: code
      - uses: actions/checkout@v4
        with:
          ref: forward-test
          path: data
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Décision sur la dernière bougie fermée
        run: node code/tools/forward.cjs data/forward
      - name: Enregistrer le journal
        run: |
          cd data
          git config user.name "forward-test"
          git config user.email "forward-test@users.noreply.github.com"
          git add -A forward
          if ! git diff --cached --quiet; then
            git commit -q -m "Forward test $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull -q --rebase origin forward-test && git push -q origin HEAD:forward-test
          fi
