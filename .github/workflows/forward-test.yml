# Forward test 24 h/24 : le même moteur que le site décide sur chaque bougie fermée avec la configuration gelée de
# forward/config.json (branche forward-test). Argent fictif, aucun ordre, aucune clé.
# Les familles de stratégies sont suivies en parallèle (tools/familles-fw.cjs, une décision par heure fermée).
# GitHub retarde souvent les tâches programmées : chaque tâche reste donc active environ 50 minutes et vérifie chaque
# minute si une nouvelle bougie s'est fermée ; une nouvelle tâche est demandée tous les quarts d'heure (une seule à la fois).
name: Forward test 24 h/24
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: forward-test
  cancel-in-progress: false
jobs:
  passage:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
        with:
          path: code
      - uses: actions/checkout@v4
        with:
          ref: forward-test
          path: data
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Décisions sur chaque bougie fermée pendant environ 50 minutes
        run: |
          cd data
          git config user.name "forward-test"
          git config user.email "forward-test@users.noreply.github.com"
          fin=$(( $(date +%s) + 50*60 ))
          # En cas de conflit avec la branche distante : on abandonne le rebase et on repart de la version distante
          # (les programmes reprennent là où l'état enregistré s'est arrêté). Jamais de fichier en conflit enregistré.
          sync() { git pull -q --rebase origin forward-test || { git rebase --abort 2>/dev/null; git fetch -q origin forward-test && git reset -q --hard origin/forward-test; return 1; }; }
          while [ $(date +%s) -lt $fin ]; do
            sync || true
            node ../code/tools/forward.cjs forward || echo "::warning::forward.cjs en erreur"
            node ../code/tools/familles-fw.cjs forward || echo "::warning::familles-fw.cjs en erreur"
            node ../code/tools/proposition.cjs forward || echo "::warning::proposition.cjs en erreur"
            node ../code/tools/bilan.cjs forward || echo "::warning::bilan.cjs en erreur"
            rm -f forward/*.tmp
            git add -A forward
            if ! git diff --cached --quiet; then
              git commit -q -m "Forward test $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              for k in 1 2 3; do sync && git push -q origin HEAD:forward-test && break; sleep 5; done
            fi
            sleep 60
          done
